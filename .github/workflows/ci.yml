name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - run: ruff check services/api services/worker scripts tests
      - run: mypy services/api/app services/worker scripts
      - run: pytest
      - run: python -m compileall -q services/api services/worker scripts
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventalpha
          POSTGRES_USER: eventalpha
          POSTGRES_PASSWORD: eventalpha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventalpha -d eventalpha"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      EVENTALPHA_DATABASE_URL: postgresql+psycopg://eventalpha:eventalpha@127.0.0.1:5432/eventalpha
      EVENTALPHA_ENV: ci
      EVENTALPHA_DEMO_MODE: true
      EVENTALPHA_REPLAY_AT: "2026-08-27T16:40:00+00:00"
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infra/docker/api.Dockerfile -t eventalpha-api:test .
      - run: docker run --rm --network host -e EVENTALPHA_DATABASE_URL -e EVENTALPHA_ENV -e EVENTALPHA_DEMO_MODE eventalpha-api:test python scripts/apply_migrations.py
      - run: docker run --rm --network host -e EVENTALPHA_DATABASE_URL -e EVENTALPHA_ENV -e EVENTALPHA_DEMO_MODE eventalpha-api:test python scripts/apply_migrations.py
      - run: docker run --rm --network host -e EVENTALPHA_DATABASE_URL -e EVENTALPHA_ENV -e EVENTALPHA_DEMO_MODE eventalpha-api:test python services/worker/event_worker.py
      - run: docker run --rm --network host -e EVENTALPHA_DATABASE_URL -e EVENTALPHA_ENV -e EVENTALPHA_DEMO_MODE eventalpha-api:test python services/worker/event_worker.py
      - run: docker run --rm --network host -e EVENTALPHA_DATABASE_URL -e EVENTALPHA_ENV -e EVENTALPHA_DEMO_MODE -e EVENTALPHA_REPLAY_AT eventalpha-api:test python services/worker/market_worker.py
      - run: docker run --rm --network host -e EVENTALPHA_DATABASE_URL -e EVENTALPHA_ENV -e EVENTALPHA_DEMO_MODE -e EVENTALPHA_REPLAY_AT eventalpha-api:test python services/worker/market_worker.py
      - run: docker run --rm --network host -e EVENTALPHA_DATABASE_URL -e EVENTALPHA_ENV -e EVENTALPHA_DEMO_MODE eventalpha-api:test python scripts/runtime_smoke.py
      - name: Smoke default Uvicorn command
        run: |
          docker run --rm -d --name eventalpha-api-smoke --network host \
            -e EVENTALPHA_DATABASE_URL -e EVENTALPHA_ENV -e EVENTALPHA_DEMO_MODE \
            eventalpha-api:test
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs eventalpha-api-smoke
          exit 1
      - name: Stop smoke container
        if: always()
        run: docker stop eventalpha-api-smoke || true
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
